# The whole demo: `docker compose up`, then open http://localhost:3000 (chat) and
# http://localhost:5000 (MLflow traces). Needs an NVIDIA GPU.
name: pet-triage

x-model: &model ${MODEL:-gemma4:e4b}

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # Keep the model in GPU memory, so no owner ever waits for it to load.
      OLLAMA_KEEP_ALIVE: "-1"
      # Our prompts are under 1k tokens; the default sizes the context to free VRAM
      # (256k here), which makes loading slow.
      OLLAMA_CONTEXT_LENGTH: ${CONTEXT_LENGTH:-8192}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Downloads the model (once; it is kept in the ollama volume) and loads it into the GPU,
  # then exits. The agent starts only after this, so the first message never waits for a load.
  ollama-load:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
      MODEL: *model
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$MODEL" && ollama run "$$MODEL" ""']
    depends_on:
      ollama:
        condition: service_healthy

  # Traces of every conversation turn: prompts, model replies and timings.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost:*,mlflow:5000
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 30
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"

  agent:
    build: .
    environment:
      MODEL: *model
      THINKING: ${THINKING:-true}
      TEMPERATURE: ${TEMPERATURE:-0}
      OLLAMA_BASE_URL: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: pet-triage
      # No usage data to MLflow's servers. Its telemetry also deadlocked evaluation runs:
      # scorer threads importing the same module at once.
      MLFLOW_DISABLE_TELEMETRY: "true"
      # The image has no git or .git, so MLflow can't tag runs with a commit. Say so quietly.
      GIT_PYTHON_REFRESH: quiet
    # Healthy once the server answers, which is after the graph is built and the model warm.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok')"]
      interval: 5s
      retries: 30
    depends_on:
      ollama-load:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  ui:
    build:
      context: docker
      dockerfile: ui.Dockerfile
    environment:
      LANGGRAPH_API_URL: http://agent:2024
    ports:
      # Localhost only by default; reach it from another machine over an SSH tunnel.
      # BIND_ADDRESS and UI_PORT are set in .env (see .env.example).
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:3000"
    depends_on:
      agent:
        condition: service_healthy

volumes:
  ollama:
  mlflow:
